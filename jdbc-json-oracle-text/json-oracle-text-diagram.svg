<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">JDBC JSON Oracle Text sample flow</title>
  <desc id="desc">A compact 800 by 600 overview of the sample flow from JSON file to Oracle Text search results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #14213d; }
    .bg { fill: #f7f4ea; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .card { rx: 18; ry: 18; stroke-width: 2; }
    .source { fill: #e0f2fe; stroke: #38bdf8; }
    .app { fill: #eef2ff; stroke: #818cf8; }
    .db { fill: #dcfce7; stroke: #22c55e; }
    .search { fill: #fef3c7; stroke: #f59e0b; }
    .result { fill: #ffffff; stroke: #cbd5e1; }
    .label { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; fill: #334155; }
    .small { font-size: 13px; fill: #475569; }
    .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .pill { fill: #ffffff; stroke: #cbd5e1; rx: 10; ry: 10; }
    .accent { fill: #b45309; font-weight: 700; }
  </style>

  <rect class="bg" x="0" y="0" width="800" height="600"/>

  <text class="title" x="28" y="42">How the sample works</text>
  <text class="subtitle" x="28" y="64">Load JSON, store it as native JSON, index it, then run ranked search.</text>

  <rect class="card source" x="28" y="105" width="165" height="132"/>
  <text class="label" x="46" y="135">1. Source file</text>
  <text class="body" x="46" y="162">load json from source,</text>
  <text class="body" x="46" y="185">splitting into docs:</text>
  <text class="small" x="46" y="208">title, summary, body,</text>
  <text class="small" x="46" y="226">category, author</text>

  <rect class="card app" x="222" y="105" width="172" height="132"/>
  <text class="label" x="240" y="135">2. JDBC app</text>
  <text class="body" x="240" y="162">Sample maps docs</text>
  <text class="body" x="240" y="185">to Java, then serializes</text>
  <text class="body" x="240" y="208">to OSON.</text>

  <rect class="card db" x="423" y="105" width="150" height="132"/>
  <text class="label" x="441" y="135">3. JSON table</text>
  <text class="body" x="441" y="162">docs are saved to</text>
  <text class="body" x="441" y="185">a table, using a</text>
  <text class="body" x="441" y="203">JSON column</text>
  <rect class="pill" x="441" y="212" width="108" height="24"/>
  <text class="small" x="448" y="228">stored as OSON</text>

  <rect class="card search" x="602" y="105" width="170" height="132"/>
  <text class="label" x="620" y="135">4. Search index</text>
  <text class="body" x="620" y="162">CREATE SEARCH</text>
  <text class="body" x="620" y="185">INDEX FOR JSON</text>
  <text class="small" x="620" y="208">title, summary, body</text>

  <path class="arrow" d="M 193 165 L 222 165"/>
  <path class="arrow" d="M 394 165 L 423 165"/>
  <path class="arrow" d="M 573 165 L 602 165"/>

  <rect class="card result" x="110" y="305" width="580" height="190"/>
  <text class="label" x="135" y="338">5. Query and rank results</text>
  <rect class="pill" x="135" y="360" width="130" height="28"/>
  <text class="body" x="151" y="378">keyword: oracle</text>
  <rect class="pill" x="280" y="360" width="185" height="28"/>
  <text class="body" x="296" y="378">proximity: NEAR(...)</text>
  <rect class="pill" x="480" y="360" width="180" height="28"/>
  <text class="body" x="496" y="378">mixed: text + JSON filters</text>
  <text class="body" x="135" y="422">Oracle Text evaluates indexed fields and assigns a</text>
  <text class="body" x="135" y="444">query-specific <tspan class="accent">SCORE</tspan> so rows can be sorted by relevance.</text>

  <path class="arrow" d="M 687 225 L 687 270 L 400 270 L 400 305"/>
</svg>
