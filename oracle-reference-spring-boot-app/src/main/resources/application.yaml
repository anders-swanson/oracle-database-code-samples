spring:
  application:
    name: oracle-reference-spring-boot-app
  security:
    user:
      name: ${APP_USERNAME:developer}
      password: ${APP_PASSWORD}
  datasource:
    url: ${JDBC_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${DB_USERNAME:REFERENCE_APP}
    password: ${DB_PASSWORD}
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
      connection-pool-name: ${spring.application.name}
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 8
      connection-wait-duration: 3s
      validate-connection-on-borrow: true
      seconds-to-trust-idle-connection: 10
      max-statements: 20
      connection-properties:
        "[oracle.jdbc.provider.traceEventListener]": observability-trace-event-listener-provider
        "[oracle.jdbc.provider.traceEventListener.unique_identifier]": ${spring.application.name}
        "[oracle.jdbc.serverTelemetryTracesEnabled]": true
        "[oracle.jdbc.serverTelemetryLoggingEnabled]": false
        "[oracle.net.CONNECT_TIMEOUT]": 5000
        "[oracle.jdbc.ReadTimeout]": 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:reset.sql,classpath:schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  transaction:
    default-timeout: 10s
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  address: ${APP_ADDRESS:127.0.0.1}
  port: ${APP_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:true}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
logging:
  structured:
    format:
      console: logstash
