<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Database-per-service sample architecture on Oracle AI Database</title>
  <desc id="desc">An 800 by 600 diagram showing the sample runner calling separate students and courses services, each backed by its own Oracle AI Database pluggable database.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7efe2"/>
      <stop offset="54%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#e7f1f8"/>
    </linearGradient>
    <linearGradient id="runner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10314a"/>
      <stop offset="100%" stop-color="#1f6173"/>
    </linearGradient>
    <linearGradient id="students" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ecf4"/>
      <stop offset="100%" stop-color="#f1f9fc"/>
    </linearGradient>
    <linearGradient id="courses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8edc8"/>
      <stop offset="100%" stop-color="#fff8e2"/>
    </linearGradient>
    <linearGradient id="database" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebdef5"/>
      <stop offset="100%" stop-color="#faf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#183246" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#1b4258"/>
    </marker>
    <style>
      .frame { fill: url(#bg); }
      .grain { fill: url(#grid); opacity: 0.24; }
      .eyebrow { font: 700 14px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 1.8px; text-transform: uppercase; fill: #745f4a; }
      .title { font: 700 36px Georgia, "Times New Roman", serif; fill: #10283c; }
      .subtitle { font: 400 18px Georgia, "Times New Roman", serif; fill: #39546a; }
      .mini { font: 700 13px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 1px; text-transform: uppercase; fill: #657c8d; }
      .card-title { font: 700 23px "Avenir Next", "Trebuchet MS", sans-serif; fill: #12314a; }
      .card-body { font: 500 16px "Avenir Next", "Trebuchet MS", sans-serif; fill: #355267; }
      .hero-title { font: 700 28px Georgia, "Times New Roman", serif; fill: #ffffff; }
      .hero-body { font: 600 16px "Avenir Next", "Trebuchet MS", sans-serif; fill: #d9edf4; }
      .code { font: 700 15px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #103049; }
      .small-code { font: 700 13px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #425d6e; }
      .runner-box { fill: url(#runner); stroke: #163a4f; stroke-width: 2; rx: 24; ry: 24; filter: url(#shadow); }
      .students-box { fill: url(#students); stroke: #1f5369; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .courses-box { fill: url(#courses); stroke: #8b6d1d; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .database-box { fill: url(#database); stroke: #6a4b82; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .pdb-box { fill: #fffdfa; stroke: #cfbfac; stroke-width: 1.5; rx: 18; ry: 18; }
      .line { stroke: #1b4258; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft-line { stroke: #6a7f8c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dashed { stroke: #9b7e56; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="frame" width="800" height="600"/>
  <rect class="grain" width="800" height="600"/>

  <text x="56" y="56" class="eyebrow">Oracle AI Database Sample</text>
  <text x="56" y="98" class="title">Database Per Service</text>
  <text x="56" y="128" class="subtitle">Service-owned schemas isolated by pluggable database boundaries.</text>

  <rect x="56" y="154" width="214" height="170" class="runner-box"/>
  <text x="82" y="194" class="mini" fill="#d2e6ef">Command Line</text>
  <text x="82" y="232" class="hero-title">Sample</text>
  <text x="82" y="266" class="hero-title">Runner</text>
  <text x="82" y="292" class="hero-body">loads scenarios</text>

  <rect x="330" y="154" width="180" height="134" class="students-box"/>
  <text x="354" y="184" class="mini">Port 8081</text>
  <text x="354" y="219" class="card-title">Students</text>
  <text x="354" y="246" class="card-body">Spring Boot service</text>
  <text x="354" y="270" class="small-code">POST /students</text>

  <rect x="564" y="154" width="180" height="134" class="courses-box"/>
  <text x="588" y="184" class="mini">Port 8082</text>
  <text x="588" y="219" class="card-title">Courses</text>
  <text x="588" y="246" class="card-body">Spring Boot service</text>
  <text x="588" y="270" class="small-code">POST /courses</text>

  <rect x="56" y="356" width="710" height="172" class="database-box"/>
  <text x="82" y="386" class="mini">Oracle AI Database Free</text>
  <text x="82" y="416" class="card-title">Two isolated PDBs</text>

  <rect x="286" y="442" width="220" height="64" class="pdb-box"/>
  <text x="306" y="468" class="code">studentpdb</text>
  <text x="306" y="493" class="card-body">students_app tables</text>

  <rect x="524" y="442" width="220" height="64" class="pdb-box"/>
  <text x="544" y="468" class="code">coursepdb</text>
  <text x="544" y="493" class="card-body">courses_app tables</text>

  <path d="M420 288V442" class="soft-line"/>
  <path d="M654 288V442" class="soft-line"/>
  <path d="M506 474H524" class="dashed"/>
  <text x="250" y="560" class="mini">No cross-PDB joins or shared schemas</text>
</svg>
