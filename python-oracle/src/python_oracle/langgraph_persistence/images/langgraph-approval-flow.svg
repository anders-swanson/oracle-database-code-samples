<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph travel approval flow</title>
  <desc id="desc">An 800 by 600 flow diagram showing a travel request entering LangGraph, deterministic policy evaluation, OCI approval brief drafting, human approval interruption, resume command, finalization, and approved record storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9f4ec"/>
      <stop offset="56%" stop-color="#fcfbf8"/>
      <stop offset="100%" stop-color="#e8f3f0"/>
    </linearGradient>
    <linearGradient id="agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123047"/>
      <stop offset="100%" stop-color="#24646f"/>
    </linearGradient>
    <linearGradient id="step" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1f0f6"/>
      <stop offset="100%" stop-color="#f6fbfe"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c9"/>
      <stop offset="100%" stop-color="#fffaf1"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe4f5"/>
      <stop offset="100%" stop-color="#fbf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#173247" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#1c4357"/>
    </marker>
    <style>
      .frame { fill: url(#bg); }
      .title { font: 700 34px Georgia, "Times New Roman", serif; fill: #10283c; }
      .subtitle { font: 400 18px Georgia, "Times New Roman", serif; fill: #40596d; }
      .eyebrow { font: 700 14px Arial, sans-serif; letter-spacing: 1.6px; fill: #755d42; }
      .lane { fill: #fffdfa; stroke: #d3c4ad; stroke-width: 1.5; rx: 20; ry: 20; }
      .step { fill: url(#step); stroke: #2b6777; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .step-dark { fill: url(#agent); stroke: #16384e; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .step-gold { fill: url(#gold); stroke: #9a7620; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .step-violet { fill: url(#violet); stroke: #72528c; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .label { font: 700 12px Arial, sans-serif; letter-spacing: 1px; fill: #657b88; }
      .label-light { font: 700 12px Arial, sans-serif; letter-spacing: 1px; fill: #dceef4; }
      .step-title { font: 700 20px Arial, sans-serif; fill: #123047; }
      .step-title-light { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .step-title-small { font: 700 17px Arial, sans-serif; fill: #123047; }
      .step-title-small-light { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .body { font: 500 14px Arial, sans-serif; fill: #365369; }
      .body-light { font: 500 14px Arial, sans-serif; fill: #dbeef4; }
      .code { font: 700 13px "SFMono-Regular", Consolas, monospace; fill: #123047; }
      .code-light { font: 700 13px "SFMono-Regular", Consolas, monospace; fill: #dbeef4; }
      .tag { font: 700 13px Arial, sans-serif; fill: #7a5d18; }
      .tag-bg { fill: #fffdfa; stroke: #d6c5a5; stroke-width: 1; rx: 8; ry: 8; }
      .num { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .line { stroke: #1c4357; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .thin { stroke: #7a8f9a; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dash { stroke: #9a7620; stroke-width: 2.5; fill: none; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .circle-blue { fill: #2b6777; }
      .circle-dark { fill: #123047; }
      .circle-gold { fill: #9a7620; }
      .circle-violet { fill: #72528c; }
    </style>
  </defs>

  <rect class="frame" width="800" height="600"/>

  <text x="46" y="54" class="eyebrow">LANGGRAPH EXECUTION</text>
  <text x="46" y="94" class="title">Travel Approval Flow</text>
  <text x="46" y="124" class="subtitle">Rules decide the gate; OCI drafts reviewer context before the pause.</text>

  <rect x="44" y="158" width="712" height="330" class="lane"/>

  <rect x="70" y="190" width="190" height="112" class="step"/>
  <circle cx="96" cy="216" r="17" class="circle-blue"/>
  <text x="91" y="222" class="num">1</text>
  <text x="120" y="213" class="label">INVOKE</text>
  <text x="120" y="245" class="step-title">Run request</text>
  <text x="120" y="270" class="body">thread_id carries</text>
  <text x="120" y="289" class="body">the conversation</text>

  <rect x="314" y="190" width="190" height="112" class="step-dark"/>
  <circle cx="340" cy="216" r="17" fill="#ffffff" opacity="0.22"/>
  <text x="335" y="222" class="num">2</text>
  <text x="364" y="213" class="label-light">NODE</text>
  <text x="364" y="245" class="step-title-small-light">evaluate_policy</text>
  <text x="364" y="270" class="body-light">cost &gt; 1000?</text>
  <text x="364" y="289" class="body-light">sets status</text>

  <rect x="558" y="190" width="170" height="112" class="step-gold"/>
  <circle cx="584" cy="216" r="17" class="circle-gold"/>
  <text x="579" y="222" class="num">3</text>
  <text x="608" y="213" class="label">NODE + OCI</text>
  <text x="608" y="242" class="step-title-small">draft approval</text>
  <text x="608" y="264" class="step-title-small">brief</text>
  <text x="608" y="287" class="body">request + rule</text>

  <rect x="558" y="348" width="170" height="112" class="step-gold"/>
  <circle cx="584" cy="374" r="17" class="circle-gold"/>
  <text x="579" y="380" class="num">4</text>
  <text x="608" y="371" class="label">HUMAN GATE</text>
  <text x="608" y="398" class="step-title-small">request</text>
  <text x="608" y="420" class="step-title-small">approval</text>
  <text x="608" y="443" class="body">interrupt()</text>

  <rect x="314" y="348" width="190" height="112" class="step-violet"/>
  <circle cx="340" cy="374" r="17" class="circle-violet"/>
  <text x="335" y="380" class="num">5</text>
  <text x="364" y="371" class="label">RESUME</text>
  <text x="364" y="403" class="step-title">Command</text>
  <text x="364" y="428" class="code">resume=decision</text>

  <rect x="70" y="348" width="190" height="112" class="step-dark"/>
  <circle cx="96" cy="374" r="17" fill="#ffffff" opacity="0.22"/>
  <text x="91" y="380" class="num">6</text>
  <text x="120" y="371" class="label-light">NODE</text>
  <text x="120" y="398" class="step-title-small-light">finalize</text>
  <text x="120" y="420" class="step-title-small-light">request</text>
  <text x="120" y="443" class="body-light">store approved</text>




  <text x="92" y="520" class="body">Approved decisions write request, status, policy reason, brief, and decision to OracleStore.</text>
  <text x="92" y="542" class="body">Rejected decisions keep checkpoint history only; no approval record is stored.</text>
</svg>
