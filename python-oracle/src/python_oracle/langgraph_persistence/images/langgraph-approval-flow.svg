<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph approval flow</title>
  <desc id="desc">An 800 by 600 diagram showing a LangGraph travel approval request split into a fast policy path and a human review path, with Oracle AI Database persistence for checkpoints and approved records.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#22313c"/>
    </marker>
    <style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 34px Arial, sans-serif; fill: #17232d; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #42515d; }
      .panel { stroke-width: 2.25; }
      .start-panel { fill: #eaf4fa; stroke: #3a7694; }
      .fast-panel { fill: #edf8f0; stroke: #4f8a5a; }
      .review-panel { fill: #fff5e6; stroke: #b7741c; }
      .db-panel { fill: #f2f5f8; stroke: #7a8895; }
      .card { fill: #ffffff; stroke: #9eacb6; stroke-width: 1.8; }
      .card-strong { fill: #ffffff; stroke: #22313c; stroke-opacity: 0.35; stroke-width: 2; }
      .eyebrow { font: 700 14px Arial, sans-serif; fill: #52616d; letter-spacing: 0.8px; }
      .panel-title { font: 700 23px Arial, sans-serif; fill: #17232d; }
      .step-title { font: 700 21px Arial, sans-serif; fill: #17232d; }
      .body { font: 400 16px Arial, sans-serif; fill: #30414d; }
      .body-strong { font: 700 16px Arial, sans-serif; fill: #30414d; }
      .db-title { font: 700 20px Arial, sans-serif; fill: #17232d; }
      .db-body { font: 400 15px Arial, sans-serif; fill: #30414d; }
      .arrow { fill: none; stroke: #22313c; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #61717d; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="800" height="600"/>
  <text class="title" x="40" y="49">LangGraph Approval Flow</text>
  <text class="subtitle" x="40" y="78">One policy check chooses the fast path or the human review path.</text>

  <rect class="panel start-panel" x="40" y="108" width="720" height="112" rx="10" ry="10"/>
  <text class="eyebrow" x="64" y="139">SHARED START</text>

  <rect class="card-strong" x="64" y="154" width="250" height="44" rx="8" ry="8"/>
  <text class="step-title" x="84" y="182">TravelRequest</text>

  <path class="arrow" d="M314 176H390"/>

  <rect class="card-strong" x="390" y="154" width="346" height="44" rx="8" ry="8"/>
  <text class="step-title" x="410" y="182">evaluate_policy routes</text>

  <path class="soft-arrow" d="M210 220V246"/>
  <path class="soft-arrow" d="M590 220V246"/>

  <rect class="panel fast-panel" x="40" y="250" width="340" height="218" rx="10" ry="10"/>
  <text class="eyebrow" x="64" y="282">FAST PATH</text>
  <text class="panel-title" x="64" y="314">Within policy</text>

  <rect class="card" x="64" y="338" width="292" height="82" rx="8" ry="8"/>
  <text class="step-title" x="86" y="371">Finalize request</text>
  <text class="body" x="86" y="397">No human review needed</text>

  <rect class="panel review-panel" x="420" y="250" width="340" height="218" rx="10" ry="10"/>
  <text class="eyebrow" x="444" y="282">HUMAN REVIEW PATH</text>
  <text class="panel-title" x="444" y="314">Needs approval</text>

  <rect class="card" x="444" y="334" width="292" height="34" rx="8" ry="8"/>
  <text class="body-strong" x="462" y="357">1. Draft brief with ChatOCIGenAI</text>

  <rect class="card" x="444" y="386" width="292" height="34" rx="8" ry="8"/>
  <text class="body-strong" x="462" y="409">2. Pause with interrupt payload</text>

  <rect class="card" x="444" y="438" width="292" height="34" rx="8" ry="8"/>
  <text class="body-strong" x="462" y="461">3. Resume, then finalize</text>

  <rect class="panel db-panel" x="40" y="494" width="720" height="70" rx="10" ry="10"/>
  <text class="eyebrow" x="64" y="523">ORACLE AI DATABASE PERSISTENCE</text>
  <text class="db-title" x="64" y="550">OracleSaver</text>
  <text class="db-body" x="184" y="550">checkpoints paused graph state</text>
  <text class="db-title" x="430" y="550">OracleStore</text>
  <text class="db-body" x="550" y="550">stores approved records</text>
</svg>
