name: okafka-agent-memory

services:
  oracle-free:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_RANDOM_PASSWORD: "yes"
      APP_USER: TESTUSER
      APP_USER_PASSWORD: "Welcome123#"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/init.sql:/container-entrypoint-initdb.d/01-lab.sql:ro
      - ./src/test/resources/okafka.sql:/lab/okafka.sql:ro
      - ./src/main/resources/db:/lab/db:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'WHENEVER SQLERROR EXIT FAILURE\nSELECT t.preparation_status, m.transcript_id, m.evidence, m.judge_score FROM transcripts t, event_memories m WHERE 1 = 0;\nEXIT;\n'
          | sqlplus -L -s 'TESTUSER/Welcome123#@//localhost:1521/FREEPDB1' > /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
