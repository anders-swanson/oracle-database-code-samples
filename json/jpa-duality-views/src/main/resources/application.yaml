spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    dv:
      # create-drop views after JPA ddl-auto is complete
      ddl-auto: create-drop
      # Print JSON Relational Duality Views to the console
      show-sql: true
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/freepdb1}
    username: ${DB_USERNAME:testuser}
    password: ${DB_PASSWORD:testpwd}
    driver-class-name: oracle.jdbc.OracleDriver
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
      connection-pool-name: ConsumerConnectionPool
      initial-pool-size: 15
      min-pool-size: 10
      max-pool-size: 30
