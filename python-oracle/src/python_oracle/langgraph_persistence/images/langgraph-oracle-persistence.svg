    </symbol>
    <style>
      .frame { fill: url(#bg); }
      .grid { fill: url(#grid); opacity: 0.36; }
      .eyebrow { font: 700 14px Arial, sans-serif; letter-spacing: 1.6px; fill: #755d42; }
      .title { font: 700 34px Georgia, "Times New Roman", serif; fill: #10283c; }
      .subtitle { font: 400 16px Georgia, "Times New Roman", serif; fill: #40596d; }
      .label { font: 700 12px Arial, sans-serif; letter-spacing: 1px; fill: #647b88; }
      .label-light { font: 700 12px Arial, sans-serif; letter-spacing: 1px; fill: #dbeef4; }
      .box-title { font: 700 21px Arial, sans-serif; fill: #123047; }
      .box-title-light { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .body { font: 500 15px Arial, sans-serif; fill: #365369; }
      .body-light { font: 500 15px Arial, sans-serif; fill: #dbeef4; }
      .code { font: 700 13px "SFMono-Regular", Consolas, monospace; fill: #123047; }
      .small { font: 700 12px Arial, sans-serif; letter-spacing: 0.5px; fill: #425a6a; }
      .card-blue { fill: url(#blue); stroke: #2b6777; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .card-graph { fill: url(#graph); stroke: #16384e; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .card-gold { fill: url(#gold); stroke: #9a7620; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .card-violet { fill: url(#violet); stroke: #72528c; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .db-zone { fill: #fffdfa; stroke: #cbb99e; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .pill { fill: #f5f8fb; stroke: #aab7c4; stroke-width: 1.5; rx: 16; ry: 16; }
      .note-bg { fill: #fffdfa; opacity: 0.94; rx: 8; ry: 8; }
      .line { stroke: #1c4357; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft-line { stroke: #5d7480; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dash { stroke: #9a7620; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="frame" width="800" height="600"/>
  <rect class="grid" width="800" height="600"/>

  <text x="46" y="54" class="eyebrow">ORACLE AI DATABASE SAMPLE</text>
  <text x="46" y="94" class="title">LangGraph Persistence Architecture</text>
  <text x="46" y="124" class="subtitle">OCI drafts briefs; OracleSaver checkpoints; OracleStore saves records.</text>

  <rect x="46" y="178" width="180" height="130" class="card-blue"/>
  <text x="70" y="210" class="label">PYTHON APP</text>
  <text x="70" y="244" class="box-title">Travel request</text>
  <text x="70" y="270" class="body">Ava, Chicago,</text>
  <text x="70" y="286" class="body">$1450 estimate</text>

  <rect x="270" y="144" width="252" height="198" class="card-graph"/>
  <circle cx="310" cy="192" r="28" fill="#ffffff" opacity="0.18"/>
  <use href="#icon-graph" x="282" y="164" width="56" height="56" color="#ffffff"/>
  <text x="350" y="180" class="label-light">COMPILED GRAPH</text>
  <text x="350" y="215" class="box-title-light">LangGraph</text>
  <text x="350" y="244" class="body-light">evaluate_policy</text>
  <text x="350" y="266" class="body-light">draft_approval_brief</text>
  <text x="350" y="288" class="body-light">request_approval</text>
  <text x="350" y="310" class="body-light">finalize_request</text>

  <rect x="574" y="104" width="200" height="112" class="card-violet"/>
  <text x="598" y="136" class="label">OCI GENAI</text>
  <text x="598" y="170" class="box-title">ChatOCIGenAI</text>
  <text x="598" y="196" class="body">Approval brief</text>

  <rect x="574" y="260" width="200" height="112" class="card-gold"/>
  <text x="598" y="292" class="label">INTERRUPT</text>
  <text x="598" y="326" class="box-title">Human approval</text>
  <text x="598" y="352" class="body">Decision resumes</text>

  <rect x="64" y="416" width="672" height="126" class="db-zone"/>
  <text x="92" y="449" class="label">TESTCONTAINERS RUNTIME</text>
  <text x="92" y="485" class="box-title">Oracle AI Database Free</text>
  <text x="92" y="512" class="body">checkpoints + approved records</text>

  <rect x="388" y="442" width="150" height="72" class="pill"/>
  <text x="410" y="470" class="code">OracleSaver</text>
  <text x="410" y="494" class="body">checkpoints</text>

  <rect x="560" y="442" width="150" height="72" class="pill"/>
  <text x="582" y="470" class="code">OracleStore</text>
  <text x="582" y="494" class="body">approved records</text>

  <path d="M218 235H270" class="line"/>
  <path d="M397 342V416" class="line"/>

  <text x="535" y="180" class="small">draft</text>
  <text x="532" y="282" class="small">pause</text>
  <rect x="406" y="350" width="126" height="24" class="note-bg"/>
</svg>
