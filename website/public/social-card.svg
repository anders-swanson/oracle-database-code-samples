<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Oracle AI Database Code Samples</title>
  <desc id="desc">A social preview card for the Oracle AI Database code samples website.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091422" />
      <stop offset="55%" stop-color="#07111d" />
      <stop offset="100%" stop-color="#061019" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="0%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#59d4ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#59d4ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowWarm" cx="100%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#ffb066" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#ffb066" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13253d" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#091525" stop-opacity="0.94" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59d4ff" />
      <stop offset="55%" stop-color="#69c6ff" />
      <stop offset="100%" stop-color="#5de0a7" />
    </linearGradient>
    <linearGradient id="accentWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb066" />
      <stop offset="100%" stop-color="#ffd38d" />
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glowCyan)" />
  <rect width="1200" height="630" fill="url(#glowWarm)" />

  <g opacity="0.14">
