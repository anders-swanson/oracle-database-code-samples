management:
  tracing:
    sampling:
      # Send 100% of spans
      probability: 1
  zipkin:
    tracing:
      # Default Zipkin tracing endpoint from Docker compose
      endpoint: http://localhost:9411/api/v2/spans

spring:
  application:
    name: JMSTracingApp
  profiles:
    active: scheduleProducer
  datasource:
    username: testuser
    password: testpwd
    # Docker compose Oracle Free container
    url: jdbc:oracle:thin:@localhost:1522/freepdb1
    # Set these to use UCP over Hikari.
    driver-class-name: oracle.jdbc.OracleDriver
    type: oracle.ucp.jdbc.PoolDataSourceImpl
    oracleucp:
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 30
      connection-pool-name: UCPSampleApplication
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
