<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Support Case Access Guardrails</title>
  <desc id="desc">A JDBC application sends end-user context to Oracle AI Database policy controls, which filter support case rows, mask sensitive columns, guard writes, and record audit attribution.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #111827; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .lane-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; ry: 8; }
    .app { fill: #ecfeff; stroke: #0891b2; }
    .context { fill: #fef3c7; stroke: #d97706; }
    .policy { fill: #eef2ff; stroke: #4f46e5; }
    .data { fill: #f0fdf4; stroke: #16a34a; }
    .audit { fill: #fff1f2; stroke: #e11d48; }
    .label { font-size: 13px; font-weight: 700; }
    .detail { font-size: 12px; fill: #475569; }
    .tiny { font-size: 11px; fill: #475569; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .deny { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow-red); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Support Case Access Guardrails</text>
  <text x="40" y="73" class="subtitle">One JDBC user, changing end-user context, database-enforced row and column decisions.</text>

  <text x="40" y="116" class="lane-title">JDBC application</text>
  <rect x="40" y="132" width="155" height="84" class="box app"/>
  <text x="56" y="158" class="label">Same SQL</text>
  <text x="56" y="181" class="detail">SELECT cases</text>
  <text x="56" y="199" class="detail">UPDATE status</text>

  <rect x="40" y="250" width="155" height="126" class="box app"/>
  <text x="56" y="276" class="label">Actors</text>
  <text x="56" y="299" class="detail">Alice: agent</text>
  <text x="56" y="317" class="detail">Bob: agent</text>
  <text x="56" y="335" class="detail">Maria: manager</text>
  <text x="56" y="353" class="detail">Router: service</text>

  <text x="246" y="116" class="lane-title">End-user context</text>
  <rect x="236" y="132" width="168" height="112" class="box context"/>
  <text x="252" y="158" class="label">Deep Sec context</text>
  <text x="252" y="181" class="detail">end user name</text>
  <text x="252" y="199" class="detail">data roles</text>
  <text x="252" y="217" class="detail">tenant + region attrs</text>

  <rect x="236" y="280" width="168" height="96" class="box context"/>
  <text x="252" y="306" class="label">Local fallback</text>
  <text x="252" y="329" class="detail">DBMS_SESSION</text>
  <text x="252" y="347" class="detail">secured view</text>
  <text x="252" y="365" class="detail">package session state</text>

  <text x="456" y="116" class="lane-title">Oracle AI Database policy</text>
  <rect x="444" y="132" width="176" height="126" class="box policy"/>
  <text x="462" y="158" class="label">Policy layer</text>
  <text x="462" y="181" class="detail">row filters</text>
  <text x="462" y="199" class="detail">column masking</text>
  <text x="462" y="217" class="detail">guarded writes</text>
  <text x="462" y="235" class="detail">scoped elevation</text>

  <rect x="444" y="294" width="176" height="82" class="box audit"/>
  <text x="462" y="320" class="label">Audit attribution</text>
  <text x="462" y="343" class="detail">actor + role</text>
  <text x="462" y="361" class="detail">operation + row count</text>

  <text x="664" y="116" class="lane-title">Protected data</text>
  <rect x="642" y="132" width="118" height="126" class="box data"/>
  <text x="658" y="158" class="label">Cases</text>
  <text x="658" y="181" class="detail">tenant</text>
  <text x="658" y="199" class="detail">region</text>
  <text x="658" y="217" class="detail">assignee</text>
  <text x="658" y="235" class="detail">status</text>

  <rect x="642" y="294" width="118" height="82" class="box data"/>
  <text x="658" y="320" class="label">Sensitive</text>
  <text x="658" y="343" class="detail">email</text>
  <text x="658" y="361" class="detail">SSN + notes</text>

  <path d="M 195 172 L 236 172" class="arrow"/>
  <path d="M 404 188 L 444 188" class="arrow"/>
  <path d="M 620 188 L 642 188" class="arrow"/>
  <path d="M 532 258 L 532 294" class="arrow"/>
  <path d="M 195 316 C 215 316 216 328 236 328" class="arrow"/>
  <path d="M 620 334 L 642 334" class="arrow"/>

  <rect x="62" y="425" width="160" height="86" class="box data"/>
  <text x="79" y="452" class="label">Allowed read</text>
  <text x="79" y="475" class="detail">Alice gets 1001, 1002</text>
  <text x="79" y="493" class="detail">SSN is masked</text>

  <rect x="246" y="425" width="160" height="86" class="box policy"/>
  <text x="263" y="452" class="label">Manager write</text>
  <text x="263" y="475" class="detail">Maria updates ACME</text>
  <text x="263" y="493" class="detail">West regional case</text>

  <rect x="430" y="425" width="160" height="86" class="box app"/>
  <text x="447" y="452" class="label">Zero-effect write</text>
  <text x="447" y="475" class="detail">Bob uses same SQL</text>
  <text x="447" y="493" class="detail">0 rows affected</text>

  <rect x="614" y="425" width="146" height="86" class="box audit"/>
  <text x="631" y="452" class="label">Scoped service</text>
  <text x="631" y="475" class="detail">Router sees case</text>
  <text x="631" y="493" class="detail">only while elevated</text>

  <path d="M 222 468 L 246 468" class="arrow"/>
  <path d="M 406 468 L 430 468" class="deny"/>
  <path d="M 590 468 L 614 468" class="arrow"/>
  <text x="40" y="560" class="tiny">Deep Sec deployment: data roles + data grants + EndUserSecurityContext. Local proof: DBMS_SESSION-style context + guarded SQL + audit table.</text>
</svg>
