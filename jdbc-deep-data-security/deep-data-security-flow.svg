<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Deep Data Security JDBC Flow</title>
  <desc id="desc">A JDBC test connects as local Deep Sec end users. Oracle AI Database evaluates data roles and data grants to filter rows, mask unauthorized cells, and guard updates.</desc>
  <rect width="800" height="600" fill="#f7fafc"/>
  <text x="400" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17202a">JDBC Deep Data Security Test</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#3d4d5c">Same SQL, different end-user context, database-enforced results</text>

  <rect x="50" y="140" width="180" height="126" rx="8" fill="#ffffff" stroke="#28536b" stroke-width="3"/>
  <text x="140" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">JUnit + JDBC</text>
  <text x="140" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#34495e">connect as</text>
  <text x="140" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1b4f72">"manderson"</text>
  <text x="140" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1b4f72">"ebaker"</text>

  <rect x="310" y="132" width="180" height="142" rx="8" fill="#eef6ff" stroke="#1f618d" stroke-width="3"/>
  <text x="400" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Deep Sec Context</text>
  <text x="400" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#34495e">ORA_END_USER_CONTEXT</text>
  <text x="400" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#34495e">username</text>
  <text x="400" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#34495e">active data roles</text>

  <rect x="570" y="118" width="180" height="170" rx="8" fill="#fff8e8" stroke="#b9770e" stroke-width="3"/>
  <text x="660" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5f3b00">Data Grants</text>
  <text x="660" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d5656">own record</text>
  <text x="660" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d5656">direct reports</text>
  <text x="660" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d5656">update own phone</text>
  <text x="660" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d5656">exclude SSN cells</text>

  <path d="M230 203 H300" stroke="#566573" stroke-width="4" fill="none"/>
  <polygon points="300,203 286,194 286,212" fill="#566573"/>
  <path d="M490 203 H560" stroke="#566573" stroke-width="4" fill="none"/>
  <polygon points="560,203 546,194 546,212" fill="#566573"/>

  <rect x="84" y="372" width="292" height="114" rx="8" fill="#eafaf1" stroke="#117a65" stroke-width="3"/>
  <text x="230" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b5345">Marvin</text>
  <text x="230" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#145a32">sees own row + direct reports</text>
  <text x="230" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#145a32">direct-report SSNs return NULL</text>

  <rect x="424" y="372" width="292" height="114" rx="8" fill="#fdf2f8" stroke="#a93266" stroke-width="3"/>
  <text x="570" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7d1b4d">Emma</text>
  <text x="570" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6c2a4b">sees only her own row</text>
  <text x="570" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6c2a4b">own SSN remains visible</text>

  <path d="M660 288 C650 335 560 344 570 366" stroke="#566573" stroke-width="4" fill="none"/>
  <polygon points="570,366 559,353 579,352" fill="#566573"/>
  <path d="M660 288 C650 335 246 344 230 366" stroke="#566573" stroke-width="4" fill="none"/>
  <polygon points="230,366 222,351 241,356" fill="#566573"/>

  <rect x="190" y="520" width="420" height="38" rx="6" fill="#ffffff" stroke="#85929e" stroke-width="2"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">The test asserts rows, masked cells, allowed update, and denied update.</text>
</svg>
