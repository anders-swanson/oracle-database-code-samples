        <text x="241" y="31" text-anchor="middle" fill="#f4f7ff" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600">JSON</text>
        <text x="378" y="31" text-anchor="middle" fill="#f4f7ff" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600">Graph</text>
        <text x="535" y="31" text-anchor="middle" fill="#f4f7ff" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600">Spring Boot</text>
      </g>
    </g>

    <g transform="translate(735 64)">
