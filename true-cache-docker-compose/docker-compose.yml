name: true-cache-docker-compose

services:
  # The Oracle AI Database Free image runs as UID 54321. A new named volume is root-owned,
  # so initialize its ownership before the primary exports its password file.
  true-cache-password-volume-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown 54321:54321 /var/tmp && chmod 0755 /var/tmp"]
    volumes:
      - true-cache-primary-password:/var/tmp

  oracle-free:
    container_name: true-cache-docker-compose-oracle-free
    # True Cache requires the full Oracle AI Database Free image. The primary
    # also needs redo configuration so committed changes can be applied by the
    # cache.
    image: container-registry.oracle.com/database/free:latest
    ports:
      - "1522:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-Welcome12345}
      ENABLE_ARCHIVELOG: "true"
      ENABLE_FORCE_LOGGING: "true"
    volumes:
      # Export the password file when the primary starts.
      - ./oracle/startup:/opt/oracle/scripts/startup:ro
      # The configuration helper runs this SQL on the writable primary.
      - ./oracle/redis:/home/oracle/redis-setup:ro
      # The startup script copies the primary password file here. The True
      # Cache container mounts the same volume at /var/tmp/orapwFREE.
      - true-cache-primary-password:/var/tmp
    depends_on:
      true-cache-password-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -r /var/tmp/orapwFREE && printf 'WHENEVER SQLERROR EXIT FAILURE\\nSELECT 1 FROM DUAL;\\nEXIT;\\n' | sqlplus -L -s \"system/$$ORACLE_PWD@//localhost:1521/FREEPDB1\" >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  # Both database services use Compose DNS names rather than fixed IPs.
  true-cache:
    container_name: true-cache-docker-compose-true-cache
    image: container-registry.oracle.com/database/free:latest
    ports:
      - "1523:1521"
      - "127.0.0.1:6379:6379"
    environment:
      TRUE_CACHE: "true"
      PRIMARY_DB_CONN_STR: oracle-free:1521/FREE
      PRIMARY_DB_PWD_FILE: /var/tmp/orapwFREE
      PDB_TC_SVCS: FREEPDB1:FREEPDB1:FREEPDB1_TC
      TRUEDB_UNIQUE_NAME: TRUEFREE
      # Keep the redo destination stable when this container is recreated.
      ORACLE_HOSTNAME: true-cache
      ORACLE_PWD: ${ORACLE_PWD:-Welcome12345}
    volumes:
      - ./oracle/redis:/home/oracle/redis-setup:ro
      # Keep the exported password file itself read-only (mode 0444), while
      # allowing the cache image to create its own runtime files in /var/tmp.
      - true-cache-primary-password:/var/tmp
    depends_on:
      oracle-free:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'WHENEVER SQLERROR EXIT FAILURE\\nALTER SESSION SET CONTAINER=FREEPDB1;\\nSELECT 1 FROM DUAL;\\nEXIT;\\n' | sqlplus -L -s / as sysdba >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 108
      start_period: 120s

  # Compose cannot run a command inside another service after it starts. This
  # one-shot local-development helper registers the True Cache service on the
  # primary, sets up the demo schema, then enables TCPS and Redis on the cache.
  # It requires the local Docker socket and must not be used on shared hosts.
  true-cache-configure:
    image: docker:cli
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-Welcome12345}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      true-cache:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        script=/tmp/configure-primary-truecache-service.sh
        docker cp true-cache-docker-compose-true-cache:/home/oracle/configure-primary-truecache-service.sh "$${script}"
        docker cp "$${script}" true-cache-docker-compose-oracle-free:/home/oracle/configure-primary-truecache-service.sh
        password=$$(printf %s "$$ORACLE_PWD" | base64 | tr -d '\n')
        docker exec --user oracle true-cache-docker-compose-oracle-free \
          bash /home/oracle/configure-primary-truecache-service.sh \
          FREEPDB1 FREEPDB1_TC FREEPDB1 true-cache:1521/TRUEFREE FREE FREE false \
          "B64:$${password}"
        docker exec --user oracle true-cache-docker-compose-oracle-free \
          sqlplus -L -s /nolog @/home/oracle/redis-setup/configure-true-cache.sql "$${password}"
        if ! docker exec true-cache-docker-compose-true-cache test -s /opt/oracle/oradata/dbconfig/FREE/.tls-wallet/cwallet.sso; then
          docker exec -e ORACLE_PDB=FREEPDB1 true-cache-docker-compose-true-cache /opt/oracle/configTcps.sh localhost
        fi
        docker exec --user oracle true-cache-docker-compose-true-cache \
          sqlplus -L -s /nolog @/home/oracle/redis-setup/configure-redis-dispatcher.sql
    restart: "no"

volumes:
  true-cache-primary-password:
