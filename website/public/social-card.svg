    <rect x="0" y="0" width="1056" height="466" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.05" />

    <g transform="translate(64 58)">
      <text x="0" y="0" fill="#59d4ff" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="6">
