<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Spring Boot UCP profile map</title>
  <desc id="desc">An 800 by 600 diagram showing Spring Boot choosing Oracle UCP as the data source, then using profiles to switch pool sizing, timeout, validation, harvesting, statement cache, and DRCP settings without Java code changes.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#14202a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2L10 6L2 10Z" fill="#295f63"/>
    </marker>
    <style>
      .bg { fill: #fbfcf7; }
      .header { fill: #eef7f4; }
      .eyebrow { font: 800 13px "Avenir Next", "Trebuchet MS", sans-serif; fill: #5e6d68; text-transform: uppercase; }
      .title { font: 800 34px "Avenir Next", "Trebuchet MS", sans-serif; fill: #152330; }
      .subtitle { font: 600 16px "Avenir Next", "Trebuchet MS", sans-serif; fill: #49646a; }
      .card { fill: #ffffff; stroke: #152330; stroke-width: 2; filter: url(#shadow); }
      .mint { fill: #9bd7d1; stroke: #152330; stroke-width: 2; filter: url(#shadow); }
      .gold { fill: #f2c94c; stroke: #152330; stroke-width: 2; filter: url(#shadow); }
      .navy { fill: #152330; stroke: #152330; stroke-width: 2; filter: url(#shadow); }
      .label { font: 800 18px "Avenir Next", "Trebuchet MS", sans-serif; fill: #152330; }
      .text { font: 600 14px "Avenir Next", "Trebuchet MS", sans-serif; fill: #30484f; }
      .small { font: 700 12px "Avenir Next", "Trebuchet MS", sans-serif; fill: #30484f; }
      .dark-label { font: 800 18px "Avenir Next", "Trebuchet MS", sans-serif; fill: #ffffff; }
      .dark-text { font: 700 13px "Avenir Next", "Trebuchet MS", sans-serif; fill: #d9f4ef; }
      .code { font: 800 12px "Menlo", "Consolas", monospace; fill: #152330; }
      .arrow { fill: none; stroke: #295f63; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="800" height="600"/>
  <rect class="header" width="800" height="132"/>
  <path d="M0 496C130 452 244 462 374 502C514 546 648 530 800 468V600H0Z" fill="#2e6f95" opacity="0.08"/>

  <text x="44" y="50" class="eyebrow">configuration</text>
  <text x="44" y="90" class="title">One Sample, Several Pool Behaviors</text>
  <text x="44" y="116" class="subtitle">Spring profiles switch UCP settings while the Java code stays small.</text>

  <rect x="50" y="166" width="206" height="104" rx="6" class="card"/>
  <text x="74" y="202" class="label">Spring Boot</text>
  <text x="74" y="230" class="code">spring.datasource.type</text>
  <text x="74" y="252" class="text">oracle.ucp.jdbc.PoolDataSource</text>

  <rect x="300" y="166" width="200" height="104" rx="6" class="gold"/>
  <text x="324" y="202" class="label">UCP binding</text>
  <text x="324" y="230" class="text">oracleucp settings</text>
  <text x="324" y="252" class="text">become PoolDataSource state</text>

  <rect x="544" y="166" width="206" height="104" rx="6" class="mint"/>
  <text x="568" y="202" class="label">Oracle AI Database</text>
  <text x="568" y="230" class="text">JDBC sessions</text>
  <text x="568" y="252" class="text">through Universal Pool</text>

  <path d="M256 218H300" class="arrow"/>
  <path d="M500 218H544" class="arrow"/>

  <rect x="54" y="346" width="156" height="86" rx="6" class="navy"/>
  <text x="76" y="378" class="dark-label">Sizing</text>
  <text x="76" y="404" class="dark-text">initial, min, max</text>

  <rect x="232" y="346" width="156" height="86" rx="6" class="navy"/>
  <text x="254" y="378" class="dark-label">Timeouts</text>
  <text x="254" y="404" class="dark-text">idle, wait, reuse</text>

  <rect x="410" y="346" width="156" height="86" rx="6" class="navy"/>
  <text x="432" y="378" class="dark-label">Validation</text>
  <text x="432" y="404" class="dark-text">borrow-time ping</text>

  <rect x="588" y="346" width="156" height="86" rx="6" class="navy"/>
  <text x="610" y="378" class="dark-label">DRCP</text>
  <text x="610" y="404" class="dark-text">pooled server URL</text>

  <path d="M400 270V314H132V346" class="arrow"/>
  <path d="M400 314H310V346" class="arrow"/>
  <path d="M400 314H488V346" class="arrow"/>
  <path d="M400 314H666V346" class="arrow"/>

  <rect x="102" y="496" width="596" height="46" rx="6" fill="#f8eee8" stroke="#d5967f" stroke-width="2"/>
  <text x="128" y="525" class="small">The useful trick is comparing pool behavior by profile before changing application code.</text>
</svg>
