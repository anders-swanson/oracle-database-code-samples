management:
  tracing:
    sampling:
      # Send 100% of spans
      probability: 1
  zipkin:
    tracing:
      # Default Zipkin tracing endpoint from Docker compose
      endpoint: http://localhost:9411/api/v2/spans

spring:
  jmx:
    enabled: true
  application:
    name: JDBCTracingApp
  profiles:
    active: scheduleProducer
  datasource:
    username: testuser
    password: testpwd
    # Docker compose Oracle Free container
    url: jdbc:oracle:thin:@localhost:1522/freepdb1?oracle.jdbc.provider.traceEventListener=oracle-database-trace-event-listener-provider
    # Set these to use UCP over Hikari.
    driver-class-name: oracle.jdbc.OracleDriver
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 30
      connection-pool-name: UCPSampleApplication
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
