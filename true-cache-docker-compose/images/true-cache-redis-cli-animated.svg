<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">redis-cli reads through True Cache</title>
  <desc id="desc">A redis-cli terminal sends read requests over a Redis protocol TCPS connection to True Cache. The cache receives committed changes from the Oracle AI Database primary through redo apply.</desc>
  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#6ce3d5" stroke-width="2"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#f5c570" stroke-width="2"/></marker>
    <style>
      @keyframes request { from { transform: translateX(0); opacity: 0; } 15%,85% { opacity: 1; } to { transform: translateX(210px); opacity: 0; } }
      @keyframes response { from { transform: translateX(0); opacity: 0; } 15%,85% { opacity: 1; } to { transform: translateX(-210px); opacity: 0; } }
      @keyframes redo { from { transform: translateY(0); opacity: 0; } 15%,85% { opacity: 1; } to { transform: translateY(111px); opacity: 0; } }
      .request-dot { animation: request 3.6s ease-in-out infinite; }
      .response-dot { animation: response 3.6s ease-in-out 1.1s infinite; }
      .redo-dot { animation: redo 3.6s ease-in-out .5s infinite; }
      @media (prefers-reduced-motion: reduce) { .request-dot, .response-dot, .redo-dot { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect width="800" height="600" fill="#101724"/>
  <rect x="40" y="42" width="720" height="516" rx="30" fill="#172231" stroke="#334858" stroke-width="2"/>
  <text x="68" y="95" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#f5f6f4">Read from True Cache with redis-cli</text>
  <path d="M608 227 V324" fill="none" stroke="#6ce3d5" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <path d="M335 392 H511" fill="none" stroke="#f5c570" stroke-width="4" marker-end="url(#arrowGold)"/>
  <path d="M511 445 H335" fill="none" stroke="#6ce3d5" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <circle class="redo-dot" cx="608" cy="227" r="7" fill="#9af4e9" opacity="0"/>
  <circle class="request-dot" cx="335" cy="392" r="7" fill="#ffe2a4" opacity="0"/>
  <circle class="response-dot" cx="511" cy="445" r="7" fill="#9af4e9" opacity="0"/>
  <text x="630" y="285" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9af4e9">redo apply</text>
  <text x="423" y="379" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f5c570">read request</text>
  <text x="423" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9af4e9">result</text>
  <g data-role="illustration">
    <rect x="494" y="157" width="228" height="70" rx="18" fill="#293748" stroke="#6d7e8b" stroke-width="2"/>
    <ellipse cx="533" cy="181" rx="18" ry="6" fill="#f0b78a"/>
    <path d="M515 181v20c0 4 8 7 18 7s18-3 18-7v-20" fill="#c76555"/>
    <text x="635" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f5f6f4">Oracle AI</text>
    <text x="635" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f5f6f4">Database</text>
    <rect x="86" y="329" width="249" height="162" rx="22" fill="#252f40" stroke="#8092a1" stroke-width="2"/>
    <path d="M87 366 H334" stroke="#8092a1" stroke-width="2"/>
    <circle cx="111" cy="348" r="5" fill="#e87878"/><circle cx="131" cy="348" r="5" fill="#f1c477"/><circle cx="151" cy="348" r="5" fill="#67d6b9"/>
    <text x="111" y="419" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#e6f4ed">&gt; redis-cli</text>
    <text x="111" y="454" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#9ad4c4">read client</text>
    <rect x="511" y="329" width="211" height="162" rx="22" fill="#1d3c49" stroke="#6ce3d5" stroke-width="2"/>
    <ellipse cx="616" cy="369" rx="42" ry="14" fill="#79e8d8"/>
    <path d="M574 369v42c0 8 19 15 42 15s42-7 42-15v-42" fill="#299eac"/>
    <ellipse cx="616" cy="411" rx="42" ry="15" fill="#47c4c1"/>
    <text x="616" y="459" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f5f6f4">True Cache</text>
  </g>
  <text x="74" y="525" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a8bac6">Redis protocol over TCPS · localhost:6379</text>
</svg>
