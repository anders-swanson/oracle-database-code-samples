<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Testcontainers PDB setup for the database-per-service sample</title>
  <desc id="desc">An 800 by 600 diagram showing the JUnit test starting Oracle AI Database Free with Testcontainers, provisioning studentpdb and coursepdb, starting both services, and running the sample runner.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7efe2"/>
      <stop offset="54%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#e7f1f8"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10314a"/>
      <stop offset="100%" stop-color="#1f6173"/>
    </linearGradient>
    <linearGradient id="container" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebdef5"/>
      <stop offset="100%" stop-color="#faf4ff"/>
    </linearGradient>
    <linearGradient id="students" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ecf4"/>
      <stop offset="100%" stop-color="#f1f9fc"/>
    </linearGradient>
    <linearGradient id="courses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8edc8"/>
      <stop offset="100%" stop-color="#fff8e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#183246" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#1b4258"/>
    </marker>
    <style>
      .frame { fill: url(#bg); }
      .grain { fill: url(#grid); opacity: 0.24; }
      .eyebrow { font: 700 14px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 1.8px; text-transform: uppercase; fill: #745f4a; }
      .title { font: 700 35px Georgia, "Times New Roman", serif; fill: #10283c; }
      .subtitle { font: 400 18px Georgia, "Times New Roman", serif; fill: #39546a; }
      .mini { font: 700 13px "Avenir Next", "Trebuchet MS", sans-serif; letter-spacing: 1px; text-transform: uppercase; fill: #657c8d; }
      .card-title { font: 700 23px "Avenir Next", "Trebuchet MS", sans-serif; fill: #12314a; }
      .card-body { font: 500 16px "Avenir Next", "Trebuchet MS", sans-serif; fill: #355267; }
      .hero-title { font: 700 27px Georgia, "Times New Roman", serif; fill: #ffffff; }
      .hero-body { font: 600 16px "Avenir Next", "Trebuchet MS", sans-serif; fill: #d9edf4; }
      .code { font: 700 14px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #103049; }
      .hero-box { fill: url(#hero); stroke: #163a4f; stroke-width: 2; rx: 24; ry: 24; filter: url(#shadow); }
      .container-box { fill: url(#container); stroke: #6a4b82; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .students-box { fill: url(#students); stroke: #1f5369; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .courses-box { fill: url(#courses); stroke: #8b6d1d; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .pdb-box { fill: #fffdfa; stroke: #cfbfac; stroke-width: 1.5; rx: 18; ry: 18; }
      .line { stroke: #1b4258; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft-line { stroke: #6a7f8c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="frame" width="800" height="600"/>
  <rect class="grain" width="800" height="600"/>

  <text x="56" y="56" class="eyebrow">Oracle AI Database Sample</text>
  <text x="56" y="98" class="title">End-to-End Test Setup</text>
  <text x="56" y="128" class="subtitle">JUnit provisions two service-owned PDBs before exercising the runner.</text>

  <rect x="56" y="164" width="176" height="126" class="hero-box"/>
  <text x="82" y="194" class="mini" fill="#d2e6ef">JUnit 5</text>
  <text x="82" y="230" class="hero-title">Sample</text>
  <text x="82" y="262" class="hero-title">Test</text>

  <rect x="292" y="164" width="214" height="126" class="container-box"/>
  <text x="318" y="194" class="mini">Testcontainers</text>
  <text x="318" y="224" class="card-title">Oracle AI</text>
  <text x="318" y="252" class="card-title">Database Free</text>
  <text x="318" y="278" class="code">oracle free container</text>

  <rect x="566" y="164" width="210" height="126" class="container-box"/>
  <text x="592" y="194" class="mini">SQL*Plus</text>
  <text x="592" y="228" class="card-title">Provision PDBs</text>
  <text x="592" y="256" class="code">create-pdbs.sql</text>
  <text x="592" y="278" class="card-body">users + tables</text>

  <rect x="74" y="366" width="286" height="126" class="students-box"/>
  <text x="98" y="396" class="mini">Students Boundary</text>
  <text x="98" y="428" class="card-title">studentpdb</text>
  <text x="98" y="456" class="code">students_app</text>
  <text x="98" y="480" class="card-body">service on free port</text>

  <rect x="438" y="366" width="286" height="126" class="courses-box"/>
  <text x="462" y="396" class="mini">Courses Boundary</text>
  <text x="462" y="428" class="card-title">coursepdb</text>
  <text x="462" y="456" class="code">courses_app</text>
  <text x="462" y="480" class="card-body">service on free port</text>


  <path d="M232 227H292" class="line"/>
  <path d="M506 227H566" class="line"/>
  <path d="M655 290V326H217V366" class="soft-line"/>
  <path d="M655 290V326H581V366" class="soft-line"/>
</svg>
