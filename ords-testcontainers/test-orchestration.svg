<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ORDS Testcontainers architecture diagram</title>
  <desc id="desc">A simple architecture diagram showing the integration test using HTTP and MongoDB against ORDS, which connects to Oracle AI Database Free on a shared Docker network.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fad"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c7a4f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5560"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #1f2933; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #52606d; }
      .zone-title { font: 700 18px Arial, sans-serif; fill: #52606d; letter-spacing: 0.06em; }
      .box-title { font: 700 30px Arial, sans-serif; fill: #1f2933; }
      .box-text { font: 400 22px Arial, sans-serif; fill: #3e4c59; }
      .small { font: 400 20px Arial, sans-serif; fill: #52606d; }
      .arrow-label { font: 700 22px Arial, sans-serif; fill: #334e68; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f7f4ee"/>

  <text x="72" y="78" class="title">ORDS Testcontainers</text>
  <text x="72" y="108" class="subtitle">Local ORDS testing with Oracle AI Database Free.</text>

  <rect x="320" y="160" width="820" height="460" fill="#fcfbf8" stroke="#d9d2c3" stroke-width="2"/>
  <text x="348" y="192" class="zone-title">SHARED DOCKER NETWORK</text>

  <rect x="70" y="260" width="190" height="110" fill="#eef5ea" stroke="#98b28b" stroke-width="2"/>
  <text x="98" y="305" class="box-title">JUnit Test</text>
  <text x="98" y="338" class="box-text">HTTP</text>

  <rect x="70" y="420" width="220" height="110" fill="#eef5ea" stroke="#98b28b" stroke-width="2"/>
  <text x="90" y="465" class="box-title">MongoDB</text>
  <text x="90" y="498" class="box-text">Client CRUD</text>

  <rect x="420" y="260" width="290" height="260" fill="#eaf2fb" stroke="#86a9cf" stroke-width="2"/>
  <text x="450" y="304" class="box-title">ORDS Container</text>
  <text x="450" y="354" class="box-text">HTTP 8080</text>
  <text x="450" y="390" class="box-text">MongoDB 27017</text>

  <rect x="790" y="260" width="320" height="260" fill="#fbeee9" stroke="#d49a8d" stroke-width="2"/>
  <text x="820" y="304" class="box-title">Oracle AI Database</text>
  <text x="820" y="338" class="box-title">Free</text>
  <text x="820" y="386" class="box-text">Free local database</text>
  <text x="820" y="422" class="box-text">`ordsuser` + `mongouser`</text>

  <line x1="260" y1="315" x2="420" y2="315" stroke="#2f6fad" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="300" y="295" class="arrow-label">HTTP</text>

  <line x1="290" y1="475" x2="420" y2="475" stroke="#4c7a4f" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="315" y="455" class="arrow-label">MongoDB</text>

  <line x1="710" y1="390" x2="790" y2="390" stroke="#4a5560" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <text x="726" y="370" class="arrow-label">JDBC</text>

  <text x="420" y="565" class="small">Schemas enabled during ORDS startup.</text>
</svg>
