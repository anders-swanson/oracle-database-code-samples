<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph persistence architecture with Oracle AI Database</title>
  <desc id="desc">An 800 by 600 architecture diagram showing a Python LangGraph travel approval workflow using deterministic policy checks, OCI approval brief drafting, OracleSaver checkpoints, OracleStore records, human approval, and Oracle AI Database Free.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f3ea"/>
      <stop offset="55%" stop-color="#fbfbf8"/>
      <stop offset="100%" stop-color="#e7f2f4"/>
    </linearGradient>
    <linearGradient id="graph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123047"/>
      <stop offset="100%" stop-color="#1f6772"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dff1f6"/>
      <stop offset="100%" stop-color="#f5fbfd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c9"/>
      <stop offset="100%" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe5f6"/>
      <stop offset="100%" stop-color="#fbf6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#163247" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.52" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#1c4357"/>
    </marker>
    <symbol id="icon-graph" viewBox="0 0 100 100">
