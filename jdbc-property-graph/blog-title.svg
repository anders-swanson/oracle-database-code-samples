<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">JDBC Property Graph title image</title>
  <desc id="desc">A simplified 800 by 600 title image for the JDBC property graph sample with a large title, a small readable graph, and short result tags.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="55%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="92" cy="90" r="80" fill="#f59e0b" opacity="0.10"/>
  <circle cx="738" cy="96" r="108" fill="#14b8a6" opacity="0.10"/>
  <circle cx="720" cy="520" r="126" fill="#2563eb" opacity="0.10"/>

  <rect x="32" y="32" width="736" height="536" rx="28" ry="28" fill="rgba(255,255,255,0.74)" stroke="rgba(148,163,184,0.34)" stroke-width="2"/>

  <text x="60" y="94" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f766e">Oracle AI Database</text>
  <text x="60" y="154" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#0f172a">JDBC Property Graph</text>

  <rect x="60" y="224" width="280" height="140" rx="24" ry="24" fill="url(#card)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="86" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Sample Flow</text>
  <rect x="86" y="280" width="104" height="30" rx="15" ry="15" fill="#ecfeff"/>
  <text x="106" y="300" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">PERSONS</text>
  <rect x="202" y="280" width="116" height="30" rx="15" ry="15" fill="#eff6ff"/>
  <text x="220" y="300" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">FRIENDSHIPS</text>
  <rect x="86" y="322" width="158" height="30" rx="15" ry="15" fill="#fff7ed"/>
  <text x="106" y="342" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">SOCIAL_GRAPH</text>
  <text x="86" y="388" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Alice -> Bob, Cara</text>

  <g fill="none" stroke-linecap="round">
    <line x1="448" y1="334" x2="530" y2="280" stroke="#94a3b8" stroke-width="8"/>
    <line x1="448" y1="334" x2="530" y2="392" stroke="#94a3b8" stroke-width="8"/>
    <line x1="590" y1="280" x2="664" y2="228" stroke="#cbd5e1" stroke-width="6"/>
    <line x1="590" y1="392" x2="664" y2="444" stroke="#cbd5e1" stroke-width="6"/>
  </g>

  <circle cx="412" cy="334" r="34" fill="url(#teal)" stroke="#ffffff" stroke-width="5"/>
  <circle cx="566" cy="280" r="34" fill="url(#blue)" stroke="#ffffff" stroke-width="5"/>
  <circle cx="566" cy="392" r="34" fill="url(#blue)" stroke="#ffffff" stroke-width="5"/>
  <circle cx="690" cy="228" r="34" fill="url(#teal)" stroke="#ffffff" stroke-width="5"/>
  <circle cx="690" cy="444" r="34" fill="url(#teal)" stroke="#ffffff" stroke-width="5"/>

  <rect x="372" y="380" width="80" height="34" rx="17" ry="17" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="412" y="402" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Alice</text>

  <rect x="526" y="326" width="80" height="34" rx="17" ry="17" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="566" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Bob</text>

  <rect x="520" y="440" width="92" height="34" rx="17" ry="17" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="566" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Cara</text>

  <rect x="636" y="274" width="108" height="34" rx="17" ry="17" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="690" y="296" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Diego</text>

  <rect x="638" y="486" width="104" height="34" rx="17" ry="17" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="690" y="508" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Emma</text>

  <rect x="60" y="500" width="176" height="42" rx="21" ry="21" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="527" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Direct: Bob, Cara</text>

  <rect x="252" y="500" width="224" height="42" rx="21" ry="21" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="272" y="527" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2 hops: Diego, Emma</text>
</svg>
