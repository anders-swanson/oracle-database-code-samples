spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  datasource:
    username: ${DB_USERNAME:testuser}
    password: ${DB_PASSWORD:testpwd}
    url: ${JDBC_URL:jdbc:oracle:thin:@localhost:1521/freepdb1}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
