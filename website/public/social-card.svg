        <circle cx="160" cy="43" r="20" fill="none" stroke="url(#accentWarm)" stroke-width="6" />
        <path d="M149 44l9 9 16-18" fill="none" stroke="#ffd38d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g opacity="0.78">
        <path d="M170 236C142 216 130 181 144 148" fill="none" stroke="#59d4ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" />
        <path d="M252 246C283 216 296 177 288 138" fill="none" stroke="#ffb066" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" />
