<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Deep Sec Policy Paths</title>
  <desc id="desc">Two policy paths for the JDBC Deep Data Security sample: a default local compatibility path that proves behavior with Testcontainers, and a Deep Sec handoff path from JDBC EndUserSecurityContext through data grants, ORA_END_USER_CONTEXT checks, and Oracle AI Database 26ai deployments.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #111827; }
    .page-title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .lane-label { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .lane-note { font-size: 12px; fill: #475569; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; ry: 8; }
    .jdbc { fill: #ecfeff; stroke: #0e7490; }
    .compat { fill: #fef3c7; stroke: #b45309; }
    .policy { fill: #eef2ff; stroke: #4338ca; }
    .proof { fill: #f0fdf4; stroke: #15803d; }
    .deepsec { fill: #fff1f2; stroke: #be123c; }
    .label { font-size: 13px; font-weight: 700; }
    .detail { font-size: 11.5px; fill: #334155; }
    .tight { font-size: 10.8px; fill: #334155; }
    .small { font-size: 11px; fill: #475569; }
    .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .handoff { stroke: #be123c; stroke-width: 2.2; fill: none; marker-end: url(#handoff-arrow); }
    .rule { stroke: #cbd5e1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="handoff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
  <text x="40" y="48" class="page-title">Deep Sec Policy Paths</text>
  <text x="40" y="73" class="subtitle">One JDBC sample keeps the authorization shape stable while changing the Oracle AI Database policy backend.</text>

  <rect x="32" y="96" width="736" height="192" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10" ry="10"/>
  <text x="50" y="124" class="lane-label">Default local compatibility path</text>
  <text x="50" y="146" class="lane-note">Runs on Oracle AI Database Free in Testcontainers without a Deep Sec service setup.</text>

  <rect x="50" y="170" width="142" height="76" class="box jdbc"/>
  <text x="66" y="195" class="label">JDBC actor</text>
  <text x="66" y="217" class="detail">Alice, Bob, Maria,</text>
  <text x="66" y="235" class="detail">or routing service</text>

  <rect x="226" y="170" width="150" height="76" class="box compat"/>
  <text x="242" y="195" class="label">Compatibility</text>
  <text x="242" y="217" class="detail">context/package</text>
  <text x="242" y="235" class="detail">sets session state</text>

  <rect x="410" y="158" width="164" height="100" class="box policy"/>
  <text x="426" y="184" class="label">Policy surface</text>
  <text x="426" y="206" class="detail">secured view</text>
  <text x="426" y="224" class="detail">guarded SQL</text>
  <text x="426" y="242" class="detail">audit table</text>

  <rect x="608" y="170" width="142" height="76" class="box proof"/>
  <text x="624" y="195" class="label">Testcontainers</text>
  <text x="624" y="217" class="detail">deterministic proof</text>
  <text x="624" y="235" class="detail">of access behavior</text>

  <path d="M 192 208 L 226 208" class="arrow"/>
  <path d="M 376 208 L 410 208" class="arrow"/>
  <path d="M 574 208 L 608 208" class="arrow"/>

  <rect x="50" y="266" width="700" height="1" fill="#cbd5e1"/>
  <text x="64" y="279" class="small">Local proof validates row filtering, masked values, denied writes, scoped elevation, and audit attribution.</text>

  <rect x="32" y="318" width="736" height="192" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10" ry="10"/>
  <text x="50" y="346" class="lane-label">Deep Sec handoff path</text>
  <text x="50" y="368" class="lane-note">Uses the same app-level actor intent with Oracle AI Database 26ai Deep Sec policy objects.</text>

  <rect x="50" y="392" width="142" height="76" class="box jdbc"/>
  <text x="66" y="417" class="label">JDBC</text>
  <text x="60" y="439" class="tight">EndUserSecurityContext</text>
  <text x="66" y="457" class="detail">actor handoff</text>

  <rect x="226" y="392" width="150" height="76" class="box deepsec"/>
  <text x="242" y="417" class="label">Deep Sec policy</text>
  <text x="242" y="439" class="detail">data roles</text>
  <text x="242" y="457" class="detail">data grants</text>

  <rect x="410" y="380" width="164" height="100" class="box policy"/>
  <text x="426" y="406" class="label">Database checks</text>
  <text x="426" y="428" class="detail">ORA_END_USER_CONTEXT</text>
  <text x="426" y="446" class="detail">role-aware access</text>
  <text x="426" y="464" class="detail">privilege checks</text>

  <rect x="608" y="392" width="142" height="76" class="box proof"/>
  <text x="624" y="417" class="label">26ai deployment</text>
  <text x="624" y="439" class="detail">Deep Sec-enabled</text>
  <text x="624" y="457" class="detail">Oracle AI Database</text>

  <path d="M 192 430 L 226 430" class="handoff"/>
  <path d="M 376 430 L 410 430" class="handoff"/>
  <path d="M 574 430 L 608 430" class="handoff"/>

  <line x1="400" y1="288" x2="400" y2="318" class="rule"/>
  <path d="M 120 246 C 120 300 120 338 120 392" class="handoff"/>
  <text x="145" y="302" class="small">Same JDBC sample contract</text>
  <text x="145" y="318" class="small">moves from local proof to Deep Sec deployment</text>

  <rect x="56" y="532" width="688" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="8" ry="8"/>
  <text x="74" y="556" class="small">Relationship: compatibility mode proves the policy outcome locally; the Deep Sec path maps the same actors and grants to 26ai-native enforcement.</text>
</svg>
