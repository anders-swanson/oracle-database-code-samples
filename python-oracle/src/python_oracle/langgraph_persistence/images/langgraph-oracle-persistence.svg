<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph persistence architecture with Oracle AI Database</title>
  <desc id="desc">An 800 by 600 architecture diagram with three clear zones: a Python LangGraph sample, a review loop, and Oracle AI Database Free persistence using OracleSaver for checkpoints and OracleStore for approved records.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 14 7 0 14Z" fill="#243642"/>
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 32px Arial, sans-serif; fill: #182832; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #425763; }
      .zone-label { font: 700 15px Arial, sans-serif; fill: #43535d; letter-spacing: 0.7px; }
      .zone-title { font: 700 22px Arial, sans-serif; fill: #182832; }
      .db-title { font: 700 20px Arial, sans-serif; fill: #182832; }
      .card-title { font: 700 20px Arial, sans-serif; fill: #182832; }
      .body { font: 400 16px Arial, sans-serif; fill: #2f424d; }
      .arrow-label { font: 700 15px Arial, sans-serif; fill: #243642; }
      .zone { stroke-width: 2; }
      .app-zone { fill: #e8f4fb; stroke: #4d8ea9; }
      .loop-zone { fill: #fff4dc; stroke: #b17a1a; }
      .db-zone { fill: #eaf6ee; stroke: #51865b; }
      .card { fill: #ffffff; stroke: #243642; stroke-opacity: 0.28; stroke-width: 1.5; }
      .footer { fill: #ffffff; stroke: #bac7cf; stroke-width: 2; }
      .footer-title { font: 700 20px Arial, sans-serif; fill: #182832; }
      .footer-text { font: 700 17px Arial, sans-serif; fill: #2f424d; }
      .arrow { fill: none; stroke: #243642; stroke-width: 3; marker-end: url(#arrow); }
      .thin-line { stroke: #243642; stroke-opacity: 0.18; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="800" height="600"/>

  <text class="title" x="40" y="50">LangGraph Persistence with Oracle AI Database</text>
  <text class="subtitle" x="40" y="80">Runtime context stays separate from resumable graph state and durable app data.</text>

  <rect class="zone app-zone" x="40" y="118" width="220" height="344" rx="10" ry="10"/>
  <text class="zone-label" x="62" y="150">PYTHON SAMPLE</text>
  <text class="zone-title" x="62" y="181">LangGraph app</text>

  <rect class="card" x="62" y="207" width="176" height="72" rx="8" ry="8"/>
  <text class="card-title" x="82" y="237">StateGraph</text>
  <text class="body" x="82" y="262">approval flow</text>

  <rect class="card" x="62" y="300" width="176" height="72" rx="8" ry="8"/>
  <text class="card-title" x="82" y="330">Runtime</text>
  <text class="body" x="82" y="355">ApprovalContext</text>

  <rect class="card" x="62" y="393" width="176" height="44" rx="8" ry="8"/>
  <text class="body" x="82" y="421">ChatOCIGenAI</text>

  <rect class="zone loop-zone" x="300" y="118" width="200" height="344" rx="10" ry="10"/>
  <text class="zone-label" x="322" y="150">REVIEW LOOP</text>
  <text class="zone-title" x="322" y="181">Human gate</text>

  <rect class="card" x="322" y="207" width="156" height="76" rx="8" ry="8"/>
  <text class="card-title" x="342" y="238">Draft brief</text>
  <text class="body" x="342" y="263">LLM summary</text>

  <path class="arrow" d="M400 289V326"/>
  <text class="arrow-label" x="416" y="313">interrupt</text>

  <rect class="card" x="322" y="332" width="156" height="76" rx="8" ry="8"/>
  <text class="card-title" x="342" y="363">Approval</text>
  <text class="body" x="342" y="388">resume command</text>

  <rect class="zone db-zone" x="540" y="118" width="220" height="344" rx="10" ry="10"/>
  <text class="zone-label" x="562" y="150">PERSISTENCE</text>
  <text class="db-title" x="562" y="181">Oracle AI Database</text>
  <text class="body" x="562" y="206">Free in Testcontainers</text>
  <line class="thin-line" x1="562" y1="221" x2="738" y2="221"/>

  <rect class="card" x="562" y="242" width="176" height="86" rx="8" ry="8"/>
  <text class="card-title" x="582" y="274">OracleSaver</text>
  <text class="body" x="582" y="300">checkpoints</text>
  <text class="body" x="582" y="319">thread resume</text>

  <rect class="card" x="562" y="352" width="176" height="86" rx="8" ry="8"/>
  <text class="card-title" x="582" y="384">OracleStore</text>
  <text class="body" x="582" y="410">approved record</text>
  <text class="body" x="582" y="429">queryable proof</text>

  <path class="arrow" d="M260 243H315"/>

  <path class="arrow" d="M478 247C515 247 522 276 557 285"/>

  <path class="arrow" d="M478 373C515 373 522 394 557 395"/>

  <rect class="footer" x="40" y="492" width="720" height="68" rx="10" ry="10"/>
  <text class="footer-title" x="62" y="522">Key idea</text>
  <text class="footer-text" x="180" y="520">OracleSaver = resumable graph state</text>
  <text class="footer-text" x="180" y="544">OracleStore = durable application data</text>
</svg>
