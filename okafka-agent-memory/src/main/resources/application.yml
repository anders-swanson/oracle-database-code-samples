spring:
  application:
    name: okafka-agent-memory
  ai:
    model:
      chat: oci-genai
      embedding: oci-genai
    oci:
      genai:
        authentication-type: FILE
        config-file: ~/.oci/config
        profile: DEFAULT
        chat:
          compartment-id: ${OCI_COMPARTMENT_ID}
          serving-mode: ON_DEMAND
          model: cohere.command-a-03-2025
          temperature: 0.2
          max-tokens: 512
        embedding:
          compartment-id: ${OCI_COMPARTMENT_ID}
          serving-mode: ON_DEMAND
          model: cohere.embed-v4.0
          dimensions: 1536
          truncate: END
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: TESTUSER
    password: 'Welcome123#'
    driver-class-name: oracle.jdbc.OracleDriver
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
      connection-pool-name: okafka-agent-memory
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 10
memory:
  candidates:
    score-threshold: 70
  retrieval:
    owner-scope: user:demo
    minimum-relevance: 0.5
    vector-weight: 0.5
    text-weight: 0.35
    recency-weight: 0.15
    recency-half-life-days: 30
  intake:
    topic: MEMORY_INCOMING
  events:
    transcripts: MEMORY_TRANSCRIPTS
    embeddings: MEMORY_EMBEDDINGS
  okafka:
    service-name: freepdb1
    security-protocol: PLAINTEXT
    bootstrap-servers: localhost:1521
    tns-admin: .
    tns-alias: ''

logging:
  level:
    org:
      apache:
        kafka: WARN
      oracle:
        okafka: WARN