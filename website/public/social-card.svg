    <path d="M0 574H1200" stroke="#d7e6ff" />
    <path d="M90 0V630" stroke="#d7e6ff" />
    <path d="M186 0V630" stroke="#d7e6ff" />
    <path d="M282 0V630" stroke="#d7e6ff" />
