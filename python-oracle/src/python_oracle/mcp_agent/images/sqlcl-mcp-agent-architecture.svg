<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">SQLcl MCP agent architecture</title>
  <desc id="desc">An 800 by 600 diagram showing a user question flowing into a Python LangChain agent, through SQLcl MCP tools, and into Oracle AI Database Free.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f3ea"/>
      <stop offset="55%" stop-color="#fbfbf8"/>
      <stop offset="100%" stop-color="#e8f2f5"/>
    </linearGradient>
    <linearGradient id="agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123047"/>
      <stop offset="100%" stop-color="#1f6772"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dff1f6"/>
      <stop offset="100%" stop-color="#f5fbfd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c9"/>
      <stop offset="100%" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe5f6"/>
      <stop offset="100%" stop-color="#fbf6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#163247" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.52" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#1c4357"/>
    </marker>
    <style>
      .frame { fill: url(#bg); }
      .grid { fill: url(#grid); opacity: 0.36; }
      .eyebrow { font: 700 14px Arial, sans-serif; letter-spacing: 1.6px; fill: #755d42; }
      .title { font: 700 34px Georgia, "Times New Roman", serif; fill: #10283c; }
      .subtitle { font: 400 18px Georgia, "Times New Roman", serif; fill: #40596d; }
      .label { font: 700 13px Arial, sans-serif; letter-spacing: 1px; fill: #647b88; }
      .box-title { font: 700 22px Arial, sans-serif; fill: #123047; }
      .box-title-light { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .body { font: 500 16px Arial, sans-serif; fill: #365369; }
      .body-light { font: 500 16px Arial, sans-serif; fill: #dbeef4; }
      .code { font: 700 14px "SFMono-Regular", Consolas, monospace; fill: #123047; }
      .small { font: 700 12px Arial, sans-serif; letter-spacing: 0.6px; fill: #425a6a; }
      .agent-box { fill: url(#agent); stroke: #16384e; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .blue-box { fill: url(#blue); stroke: #2b6777; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .gold-box { fill: url(#gold); stroke: #9a7620; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .violet-box { fill: url(#violet); stroke: #72528c; stroke-width: 2; rx: 18; ry: 18; filter: url(#shadow); }
      .db-zone { fill: #fffdfa; stroke: #cbb99e; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow); }
      .db-pill { fill: #f5f8fb; stroke: #aab7c4; stroke-width: 1.5; rx: 16; ry: 16; }
      .line { stroke: #1c4357; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft-line { stroke: #5d7480; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dash { stroke: #9a7620; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="frame" width="800" height="600"/>
  <rect class="grid" width="800" height="600"/>

  <text x="46" y="54" class="eyebrow">ORACLE AI DATABASE SAMPLE</text>
  <text x="46" y="94" class="title">SQLcl MCP Agent Architecture</text>
  <text x="46" y="124" class="subtitle">LangChain plans the work; SQLcl MCP queries the schema.</text>

  <rect x="46" y="186" width="170" height="104" class="blue-box"/>
  <text x="70" y="216" class="label">TERMINAL</text>
  <text x="70" y="250" class="box-title">User</text>
  <text x="70" y="275" class="body">Natural language</text>

  <rect x="260" y="160" width="256" height="158" class="agent-box"/>
  <text x="286" y="192" class="label" fill="#dbeef4">PYTHON ENTRYPOINT</text>
  <text x="286" y="232" class="box-title-light">LangChain Agent</text>
  <text x="286" y="260" class="body-light">create_agent(...)</text>
  <text x="286" y="286" class="body-light">MCP tools loaded from SQLcl</text>

  <rect x="586" y="110" width="168" height="106" class="violet-box"/>
  <text x="608" y="140" class="label">LLM</text>
  <text x="608" y="172" class="box-title">Chat Model</text>
  <text x="608" y="194" class="body">gpt-5-nano</text>

  <rect x="586" y="254" width="168" height="106" class="gold-box"/>
  <text x="608" y="284" class="label">MCP SERVER</text>
  <text x="608" y="317" class="box-title">SQLcl</text>
  <text x="608" y="343" class="code">sql -mcp</text>

  <rect x="64" y="398" width="672" height="138" class="db-zone"/>
  <text x="92" y="430" class="label">LOCAL CONTAINER</text>
  <text x="92" y="466" class="box-title">Oracle AI Database Free</text>
  <text x="92" y="493" class="body">Endpoint: localhost:1531/freepdb1</text>

  <rect x="368" y="428" width="150" height="74" class="db-pill"/>
  <text x="390" y="456" class="code">testuser</text>
  <text x="390" y="482" class="body">sample schema</text>

  <rect x="540" y="428" width="180" height="74" class="db-pill"/>
  <text x="562" y="456" class="code">PLAYERS</text>
  <text x="562" y="482" class="body">GAMES, SESSIONS</text>

  <path d="M196 238H260" class="line"/>

  <path d="M516 184H586" class="soft-line"/>

  <path d="M516 306H586" class="line"/>

  <path d="M670 360V398" class="line"/>
  <text x="540" y="386" class="small">saved connection</text>

  <path d="M388 398V318" class="dash"/>
  <text x="250" y="362" class="small">rows and metadata</text>
</svg>
