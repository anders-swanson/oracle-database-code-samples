server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: courses
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  datasource:
    username: ${USERNAME:courses_app}
    password: ${PASSWORD:testpwd}
    url: ${JDBC_URL:jdbc:oracle:thin:@localhost:1521/coursepdb}
    driver-class-name: oracle.jdbc.OracleDriver
    type: oracle.ucp.jdbc.PoolDataSourceImpl
    oracleucp:
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 10
      connection-pool-name: CoursesServicePool
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
