<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #111827; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .landmark { fill: #0f766e; stroke: white; stroke-width: 2; }
    .polygon { fill: rgba(220,38,38,0.08); stroke: #dc2626; stroke-width: 3; stroke-dasharray: 10 6; }
    .distance { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 5; }
    .point-label-box { fill: rgba(248,250,252,0.92); stroke: #cbd5e1; stroke-width: 1; rx: 6; ry: 6; }
    .label { font-size: 14px; font-weight: 600; }
    .distance-table { fill: #f8fafc; stroke: #bfdbfe; stroke-width: 1; rx: 10; ry: 10; }
    .distance-table-header { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
    .distance-table-row { font-size: 12px; fill: #1f2937; }
    .distance-table-value { font-size: 12px; font-weight: 700; fill: #1d4ed8; }
    .legend { font-size: 13px; fill: #374151; }
  </style>
  <rect x="0" y="0" width="900" height="700" fill="#f8fafc"/>
  <text x="70" y="48" class="title">Oracle Spatial Sample Diagram</text>
  <text x="70" y="72" class="subtitle">Sample landmarks around San Francisco with exact Oracle Spatial distances in meters</text>
  <rect x="40.00" y="110.00" width="250.00" height="230.00" class="distance-table"/>
  <text x="58" y="138" class="distance-table-header">Measured Distances</text>
  <text x="58" y="156.00" class="distance-table-row">Ferry Building to Coit Tower</text>
  <text x="58" y="174.00" class="distance-table-value">1312 m</text>
  <text x="58" y="202.00" class="distance-table-row">Ferry Building to Oracle Park</text>
  <text x="58" y="220.00" class="distance-table-value">1915 m</text>
  <text x="58" y="248.00" class="distance-table-row">Ferry Building to Golden Gate Bridge</text>
  <text x="58" y="266.00" class="distance-table-value">7927 m</text>
  <text x="58" y="294.00" class="distance-table-row">Coit Tower to Oracle Park</text>
  <text x="58" y="312.00" class="distance-table-value">3015 m</text>
  <rect x="618.67" y="283.81" width="169.06" height="268.96" class="polygon"/>
  <text x="626.67" y="273.81" class="label">Downtown Window</text>
  <line x1="729.83" y1="381.30" x2="678.69" y2="334.91" class="distance"/>
  <line x1="729.83" y1="381.30" x2="748.43" y2="494.94" class="distance"/>
  <line x1="729.83" y1="381.30" x2="372.27" y2="217.24" class="distance"/>
  <line x1="678.69" y1="334.91" x2="748.43" y2="494.94" class="distance"/>
  <circle cx="729.83" cy="381.30" r="8" class="landmark"/>
  <rect x="733.83" y="347.30" width="120.80" height="22" class="point-label-box"/>
  <text x="743.83" y="363.30" class="label">Ferry Building</text>
  <circle cx="678.69" cy="334.91" r="8" class="landmark"/>
  <rect x="682.69" y="298.91" width="92.00" height="22" class="point-label-box"/>
  <text x="692.69" y="314.91" class="label">Coit Tower</text>
  <circle cx="748.43" cy="494.94" r="8" class="landmark"/>
  <rect x="752.43" y="506.94" width="99.20" height="22" class="point-label-box"/>
  <text x="762.43" y="522.94" class="label">Oracle Park</text>
  <circle cx="372.27" cy="217.24" r="8" class="landmark"/>
  <rect x="376.27" y="183.24" width="149.60" height="22" class="point-label-box"/>
  <text x="386.27" y="199.24" class="label">Golden Gate Bridge</text>
  <text x="70" y="660" class="legend">Dashed red box: Downtown Window polygon</text>
  <text x="360" y="660" class="legend">Dashed blue lines: measured feature-to-feature distances</text>
</svg>
