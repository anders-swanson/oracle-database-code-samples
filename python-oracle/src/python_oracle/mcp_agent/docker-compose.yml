services:
  pythonmcpdb:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    container_name: python-mcpdb
    ports:
      - 1531:1521
    environment:
      - ORACLE_PASSWORD=Welcome12345
    volumes:
      - ./oracle:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "lsnrctl status | grep READY"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
